<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coding With AI Clothing Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <h1>Coding With AI</h1>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Shop</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="content">
            <h2>Fashion For Everyone</h2>
            <p>Discover the latest trends in clothing.</p>

            </div>

            <div class="card">
                <img src="https://via.placeholder.com/250" alt="">

            <div class="card">
                <img src="https://via.placeholder.com/250" alt="">

                <p>$40</p>
            </div>

        </div>

    <footer>
        <p>© 2026 Coding With AI Clothing Store</p>
    </footer>
